esphome:
  name: bme280
  friendly_name: BME280

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    #Can be dev, latest, recommended, or check https://github.com/espressif/esp-idf/releases
    version: "5.3.1"
    #check platform_version @ https://github.com/platformio/platform-espressif32/releases/
    platform_version: 6.9.0
    sdkconfig_options:
      CONFIG_OPENTHREAD_ENABLED: n
      CONFIG_ENABLE_WIFI_STATION: y
      ONFIG_USE_MINIMAL_MDNS: y
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y

# Enable logging
logger:
  level: VERY_VERBOSE

ota:
  - platform: esphome
    password: "<not for your reddit eyes :)>"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bme280 Fallback Hotspot"
    password: "<not for your reddit eyes :)>"

captive_portal:

i2c:
  id: bus_a
  setup_priority: -100 # fix for interfering with wifi!
  sda: 6
  scl: 7
  scan: false # workaround as true blocks - it wwould not even do a recovery on i2c
  

sensor:
  - platform: bme280_i2c
    setup_priority: 700 # workaround to stabilize wifi
    address: 0x76 # this is correct one, tested on Arduino IDE
    i2c_id: bus_a
    temperature:
      name: "temperature"
    humidity:
      name: "humidity"
    pressure:
      name: "pressure"
    update_interval: 3s
#  - platform: wifi_signal
#   name: "BME280 C6 WiFi Signal"
#    update_interval: 10s
#  - platform: uptime
#    name: "BME280 Uptime"
#    update_interval: 10s

